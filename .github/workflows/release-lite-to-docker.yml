name: Push Heimdall Lite to docker on every release and tag as release-latest and version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
      use_build_cloud:
        description: 'Use Docker Build Cloud (fast, uses minutes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    name: Build and Push Release to Docker Hub
    runs-on: ubuntu-24.04

    steps:
      - name: Run string replace to remove the v from the version number before using it in the docker tag
        uses: frabert/replace-string-action@v2
        id: format-tag
        with:
          pattern: 'v'
          string: '${{ github.event.release.tag_name || github.event.inputs.version}}'
          replace-with: ''
          flags: 'g'

      - name: Checkout the Heimdall Repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up QEMU (for emulated builds)
        if: github.event.inputs.use_build_cloud != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx (Local)
        if: github.event.inputs.use_build_cloud != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (Docker Build Cloud)
        if: github.event.inputs.use_build_cloud == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: "mitre/mitre-builder"

      - name: Build and push multi-platform lite image
        uses: docker/bake-action@v7
        env:
          TAG_SUFFIXES: "${{ steps.format-tag.outputs.replaced }},release-latest"
        with:
          files: docker-bake.hcl
          targets: lite
          push: true

      - name: Resolve per-architecture image digests for Iron Bank
        shell: bash
        id: digests
        env:
          IMAGE: "mitre/heimdall-lite:${{ steps.format-tag.outputs.replaced }}"
        run: bash .github/scripts/ironbank-digests.sh "$IMAGE"

      - name: Upgrade Iron Bank
        uses: mitre/ironbank_release_action@v1
        with:
          name: Heimdall-Lite
          version: ${{ steps.format-tag.outputs.replaced }}
          ironbank_pat: ${{ secrets.SAF_IRONBANK_REPO1_PAT }}
          ironbank_username: ${{ secrets.SAF_IRONBANK_REPO1_USERNAME }}
          ironbank_project_id: 6139
          ironbank_project_clone_url: repo1.dso.mil/dsop/mitre/security-automation-framework/heimdall-lite.git
          git_commit_author_name: "Automated Heimdall Release"
          git_commit_author_email: "saf@mitre.org"
          update_commands: |
            yq e -i 'del(.args.HEIMDALL_VERSION) | .tags[0]=\"${{ steps.format-tag.outputs.replaced }}\" | .labels.\"org.opencontainers.image.version\"=\"${{ steps.format-tag.outputs.replaced }}\" | .resources[0].tag=\"mitre/heimdall-lite:${{ steps.format-tag.outputs.replaced }}\" | .resources[0].url=\"docker://docker.io/mitre/heimdall-lite@${{ steps.digests.outputs.amd64 }}\" | .resources[1].tag=\"mitre/heimdall-lite:${{ steps.format-tag.outputs.replaced }}.arm64\" | .resources[1].url=\"docker://docker.io/mitre/heimdall-lite@${{ steps.digests.outputs.arm64 }}\"' hardening_manifest.yaml
            sed -i 's/^ARG HEIMDALL_VERSION=.*/ARG HEIMDALL_VERSION=${{ steps.format-tag.outputs.replaced }}/' Dockerfile
            sed -i 's/^ARG HEIMDALL_VERSION=.*/ARG HEIMDALL_VERSION=${{ steps.format-tag.outputs.replaced }}.arm64/' Dockerfile.arm64
