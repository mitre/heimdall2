name: Build RPM

# Rocky builds/install checks and native OL8 lifecycle checks cover separate
# artifacts. Integration candidates are never eligible for release publication.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "apps/**"
      - "libs/**"
      - "test/**"
      - package.json
      - yarn.lock
      - lerna.json
      - tsconfig.json
      - postcss.config.js
      - VERSION
      - .github/workflows/build-rpm.yml
  push:
    branches: [master]
    paths:
      - "packaging/**"
      - "apps/**"
      - "libs/**"
      - "test/**"
      - package.json
      - yarn.lock
      - lerna.json
      - tsconfig.json
      - postcss.config.js
      - VERSION
      - .github/workflows/build-rpm.yml
  release:
    types: [published]
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

env:
  HEIMDALL_RELEASE: 0.4.integration
  GOTOOLCHAIN: local

jobs:
  build:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    env:
      # Keep all staging, checks, listing and uploads outside the source tree.
      TOPDIR: /tmp/heimdall-rpmbuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: x86_64, runner: ubuntu-latest}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: x86_64, runner: ubuntu-latest}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: x86_64, runner: ubuntu-latest}
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: aarch64, runner: ubuntu-24.04-arm}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: aarch64, runner: ubuntu-24.04-arm}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: aarch64, runner: ubuntu-24.04-arm}

    steps:
      - name: Bootstrap git and make
        run: dnf install -y git make python3

      - uses: actions/checkout@v6
        with:
          # Release mode requires HEAD to match the VERSION tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Capture clean distribution repository inputs
        run: |
          python3 - <<'PYTHON'
          import configparser, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['TOPDIR']) / 'offline-inputs'
          for name in ('repos', 'vars', 'os-keys'):
              (root / name).mkdir(parents=True)
          owned = subprocess.check_output(['rpm', '-ql', 'rocky-release', 'rocky-repos', 'rocky-gpg-keys'], universal_newlines=True).splitlines()
          enabled = subprocess.check_output(['dnf', '-q', 'repolist', '--enabled'], universal_newlines=True)
          repos = [line.split()[0] for line in enabled.splitlines() if line.split() and line.split()[0] in ('baseos', 'appstream')]
          if set(repos) != {'baseos', 'appstream'} or len(repos) != 2:
              raise SystemExit('Expected enabled stock BaseOS and AppStream repositories')
          source = configparser.ConfigParser(interpolation=None)
          source.read([path for path in owned if path.endswith('.repo')])
          selected = configparser.ConfigParser(interpolation=None)
          keys = set()
          for repo in repos:
              selected[repo] = dict(source[repo])
              for url in source[repo]['gpgkey'].split():
                  if not url.startswith('file:///') or url[7:] not in owned:
                      raise SystemExit('Expected a release-owned distribution public key')
                  keys.add(url[7:])
          with (root / 'repos/stock.repo').open('w') as output:
              selected.write(output)
          for path in sorted(keys):
              shutil.copyfile(path, str(root / 'os-keys' / Path(path).name))
          for path in owned:
              if Path(path).parent in (Path('/etc/dnf/vars'), Path('/etc/yum/vars')) and Path(path).is_file():
                  shutil.copyfile(path, str(root / 'vars' / Path(path).name))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('OFFLINE_REPOS=' + ' '.join(repos) + '\n')
          print('Approved OS repositories: ' + ' '.join(repos))
          PYTHON

      - name: Install build dependencies
        run: |
          make -C packaging/rpm deps TOPDIR="$TOPDIR"
          dnf install -y createrepo_c gnupg2 findutils tar
          # Rocky 10 omits PATH from image metadata; retain the shell's system path.
          echo "/opt/heimdall-build/go-1.25.8/bin:$PATH" >> "$GITHUB_PATH"

      - name: Verify toolchain and source fixtures
        run: |
          test "$(go env GOVERSION)" = go1.25.8
          bash packaging/rpm/tests/build-python.sh
          python3 packaging/rpm/tests/inputs.py
          python3 packaging/rpm/tests/version-srpm.py
          python3 packaging/rpm/tests/runtime-inputs.py
          python3 packaging/rpm/tests/offline-inputs.py
          python3 packaging/rpm/tests/download-protocols.py
          python3 packaging/rpm/tests/runtime-extraction.py
          python3 packaging/rpm/tests/upgrade-scriptlets.py
          python3 packaging/rpm/tests/application-readiness.py
          python3 packaging/rpm/tests/cli-acquisition.py
          bash packaging/rpm/tests/setup.sh
          make -C packaging/rpm check-version TOPDIR="$TOPDIR"

      - name: Build candidate RPM and verify CLI inputs
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            source_mode=release
          else
            source_mode=head
          fi
          make -C packaging/rpm rpm SOURCE_MODE="$source_mode" \
            TOPDIR="$TOPDIR" HEIMDALL_RELEASE="$HEIMDALL_RELEASE"
          bash packaging/rpm/tests/cli-inputs.sh "$TOPDIR"

      - name: Rebuild the SRPM in an empty tree
        run: |
          mapfile -t srpms < <(find "$TOPDIR/SRPMS" -name '*.src.rpm')
          test "${#srpms[@]}" -eq 1
          bash packaging/rpm/tests/srpm-rebuild.sh "${srpms[0]}" /tmp/heimdall-srpm-rebuild

      - name: Lint the built packages
        run: make -C packaging/rpm lint-rpm TOPDIR="$TOPDIR"

      - name: Sign disposable test artifacts
        env:
          HEIMDALL_RPM_TEST: "1"
        run: |
          mapfile -d '' -t rpms < <(find "$TOPDIR/RPMS" "$TOPDIR/SRPMS" -name '*.rpm' -print0)
          test "${#rpms[@]}" -gt 0
          bash packaging/rpm/tests/sign-rpms.sh --container \
            "$TOPDIR/RPM-TEST-GPG-KEY" "${rpms[@]}"

      - name: Collect and archive the signed offline repository
        run: |
          major='${{ matrix.distro }}'
          major=${major#el}
          test "$(rpm --eval '%{_arch}')" = '${{ matrix.arch }}'
          mapfile -d '' -t candidates < <(find "$TOPDIR/RPMS" -type f -name 'heimdall-server-*.${{ matrix.arch }}.rpm' -print0)
          test "${#candidates[@]}" -eq 1
          make -C packaging/rpm offline TOPDIR="$TOPDIR" \
            OFFLINE_RPM="${candidates[0]}" OFFLINE_REPOSDIR="$TOPDIR/offline-inputs/repos" \
            OFFLINE_VARSDIR="$TOPDIR/offline-inputs/vars" OFFLINE_REPOS="$OFFLINE_REPOS" \
            OFFLINE_RELEASEVER="$major" OFFLINE_OS_KEY_DIR="$TOPDIR/offline-inputs/os-keys" \
            OFFLINE_HEIMDALL_KEY="$TOPDIR/RPM-TEST-GPG-KEY"

      - name: Record runtime inventory and checksums
        run: |
          cp "$TOPDIR/SOURCES/runtime-manifest.json" "$TOPDIR/runtime-manifest.json"
          cd "$TOPDIR"
          find RPMS SRPMS -type f -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum runtime-manifest.json RPM-TEST-GPG-KEY >> SHA256SUMS

      - name: Record what was built
        run: |
          find "$TOPDIR/RPMS" "$TOPDIR/SRPMS" -name '*.rpm' -printf '%f\n' | sort
          cat packaging/rpm/heimdall-cli.repo packaging/rpm/heimdall-cli.ref

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            ${{ env.TOPDIR }}/RPMS/**/*.rpm
            ${{ env.TOPDIR }}/SRPMS/*.rpm
            ${{ env.TOPDIR }}/RPM-TEST-GPG-KEY
            ${{ env.TOPDIR }}/runtime-manifest.json
            ${{ env.TOPDIR }}/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: offline-rocky-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            ${{ env.TOPDIR }}/OFFLINE/*.tar.gz
            ${{ env.TOPDIR }}/OFFLINE/*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  smoke-test:
    name: install ${{ matrix.distro }} / ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: x86_64, runner: ubuntu-latest}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: x86_64, runner: ubuntu-latest}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: x86_64, runner: ubuntu-latest}
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: aarch64, runner: ubuntu-24.04-arm}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: aarch64, runner: ubuntu-24.04-arm}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: aarch64, runner: ubuntu-24.04-arm}

    steps:
      - name: Install checkout and payload inspection tools
        run: |
          dnf install -y git cpio systemd findutils
          command -v rpm2cpio
          command -v curl
          command -v find

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: rpms

      - name: Verify checksums and install the signed package
        run: |
          (cd rpms && sha256sum --check SHA256SUMS)
          mapfile -d '' -t rpms < <(find rpms -name 'heimdall-server-*.${{ matrix.arch }}.rpm' -print0)
          test "${#rpms[@]}" -eq 1
          rpm --import rpms/RPM-TEST-GPG-KEY
          rpm --checksig --verbose "${rpms[0]}"
          # No local server is needed for a payload-only install. Retain man pages
          # even when the minimal image's DNF configuration defaults to nodocs.
          dnf install -y --setopt=localpkg_gpgcheck=1 --setopt=install_weak_deps=False \
            --setopt=tsflags= "${rpms[0]}"
          version=$(sed -e 's/[[:space:]]//g' -e 's/^v//' VERSION)
          bash packaging/rpm/tests/payload.sh "${rpms[0]}" "$version"

      - name: Verify installed manifest, CLI provenance and man pages
        run: |
          rpm -q heimdall-server
          rpm -V heimdall-server
          cmp rpms/runtime-manifest.json /usr/share/heimdall-server/runtime-manifest.json
          runtime=/usr/libexec/heimdall-server/runtime
          "$runtime/node/bin/node" --version
          "$runtime/postgresql/bin/postgres" --version
          "$runtime/postgresql/bin/psql" --version
          "$runtime/caddy/caddy" version
          rpm -qa --qf '%{NAME}\n' > /tmp/installed-packages
          if grep -Eq '^(nodejs([0-9]+)?|postgresql([0-9]+)?(-.*)?|caddy)$' /tmp/installed-packages; then exit 1; fi
          for name in node postgresql caddy; do
            test -n "$(find /usr/share/licenses/heimdall-server -type f -ipath "*$name*" -print -quit)"
          done
          cli_version=$(heimdall-cli --version)
          printf '%s\n' "$cli_version"
          version=$(sed -e 's/[[:space:]]//g' -e 's/^v//' VERSION)
          [[ "$cli_version" == *"$version"* ]]
          [[ "$cli_version" == *"$(cat packaging/rpm/heimdall-cli.ref)"* ]]
          find /usr/share/man/man1 -name 'heimdall-cli.1*' | grep -q .
          find /usr/share/man/man1 -name 'heimdall-cli-setup.1*' | grep -q .
          bash packaging/rpm/tests/logrotate.sh

      - name: Verify the installed systemd units
        run: |
          mkdir -p diagnostics
          systemd-analyze verify /usr/lib/systemd/system/heimdall-{server,postgresql,caddy}.service 2>&1 \
            | tee diagnostics/systemd-verify.log
          if [[ '${{ matrix.distro }}' == el8 ]]; then
            # systemd 239 ignores these four newer settings. Keep the directives
            # for newer systems, expose the limitation, and reject other warnings.
            awk '!/^\/usr\/lib\/systemd\/system\/heimdall-(server|postgresql|caddy).service:[0-9]+: Unknown lvalue '\''(ProtectClock|ProtectHostname|ProtectKernelLogs|ProtectProc)'\'' in section '\''Service'\''$/' \
              diagnostics/systemd-verify.log > diagnostics/unexpected.log
            test ! -s diagnostics/unexpected.log
            if [[ -s diagnostics/systemd-verify.log ]]; then
              echo '::warning::EL8 systemd ignores the newer hardening settings listed in systemd-verify.log.'
            fi
          else
            test ! -s diagnostics/systemd-verify.log
          fi

  offline-test:
    name: disconnected ${{ matrix.distro }} / ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: x86_64, runner: ubuntu-latest, platform: linux/amd64}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: x86_64, runner: ubuntu-latest, platform: linux/amd64}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: x86_64, runner: ubuntu-latest, platform: linux/amd64}
          - {distro: el8, image: "rockylinux/rockylinux:8", arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64}
          - {distro: el9, image: "rockylinux/rockylinux:9", arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64}
          - {distro: el10, image: "rockylinux/rockylinux:10", arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: offline-rocky-${{ matrix.distro }}-${{ matrix.arch }}
          path: offline

      - name: Prepare outer host only
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          docker pull --platform '${{ matrix.platform }}' '${{ matrix.image }}'

      - name: Verify disconnected install and service operation
        run: |
          mapfile -d '' -t bundles < <(find offline -name '*.tar.gz' -print0)
          test "${#bundles[@]}" -eq 1
          bash packaging/rpm/tests/run-offline.sh '${{ matrix.platform }}' '${{ matrix.image }}' "${bundles[0]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-evidence-rocky-${{ matrix.distro }}-${{ matrix.arch }}
          path: packaging/rpm/dist/offline/evidence/
          retention-days: 7
          if-no-files-found: warn

  lifecycle-ol8:
    name: OL8 lifecycle / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, platform: linux/amd64, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64, arch: aarch64}
    steps:
      - uses: actions/checkout@v6

      - name: Build two OL8 candidate releases
        run: |
          docker build --platform '${{ matrix.platform }}' -f packaging/rpm/Dockerfile.ol8 \
            --build-arg HEIMDALL_RELEASE=0.3.integration --target artifacts \
            --output type=local,dest=artifacts/first .
          docker build --platform '${{ matrix.platform }}' -f packaging/rpm/Dockerfile.ol8 \
            --build-arg HEIMDALL_RELEASE=0.4.integration --target artifacts \
            --output type=local,dest=artifacts/second .

      - name: Sign disposable lifecycle candidates
        run: |
          version=$(sed -e 's/[[:space:]]//g' -e 's/^v//' VERSION)
          bash packaging/rpm/tests/sign-rpms.sh '${{ matrix.platform }}' artifacts/RPM-TEST-GPG-KEY \
            "artifacts/first/RPMS/${{ matrix.arch }}/heimdall-server-${version}-0.3.integration.el8.${{ matrix.arch }}.rpm" \
            "artifacts/second/RPMS/${{ matrix.arch }}/heimdall-server-${version}-0.4.integration.el8.${{ matrix.arch }}.rpm"

      - name: Collect signed Oracle Linux offline bundles
        run: |
          producer="heimdall-offline-ol8-${{ matrix.arch }}"
          docker run -d --name "$producer" --platform '${{ matrix.platform }}' \
            --entrypoint /bin/bash oraclelinux:8 -c 'sleep infinity'
          trap 'docker rm -f "$producer" >/dev/null' EXIT
          docker exec "$producer" mkdir -p /workspace/packaging
          docker cp packaging/rpm "$producer:/workspace/packaging/rpm"
          docker cp artifacts "$producer:/artifacts"
          docker exec -i "$producer" bash -eu -o pipefail <<'PRODUCER'
            mkdir -p /offline-inputs/{repos,vars,os-keys}
            mapfile -t repos < <(dnf -q repolist --enabled | awk '$1 == "ol8_baseos_latest" || $1 == "ol8_appstream" { print $1 }')
            test "${#repos[@]}" -eq 2
            rpm -ql oraclelinux-release oraclelinux-release-el8 | while IFS= read -r path; do
              case "$path" in
                /etc/yum.repos.d/oracle-linux-ol8.repo) cp "$path" /offline-inputs/repos/ ;;
                /etc/dnf/vars/*|/etc/yum/vars/*) test ! -f "$path" || cp "$path" /offline-inputs/vars/ ;;
              esac
            done
            key=/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
            rpm -qf "$key" | grep -q "^oraclelinux-release"
            cp "$key" /offline-inputs/os-keys/oracle.asc
            dnf install -y make python3 createrepo_c gnupg2 findutils tar
            test "$(rpm --eval '%{_arch}')" = '${{ matrix.arch }}'
            for release in first second; do
              topdir="/offline-$release"
              mkdir -p "$topdir/SOURCES"
              cp "/artifacts/$release/runtime-manifest.json" "$topdir/SOURCES/"
              mapfile -d "" -t candidates < <(find "/artifacts/$release/RPMS" -type f -name "heimdall-server-*.${{ matrix.arch }}.rpm" -print0)
              test "${#candidates[@]}" -eq 1
              make -C /workspace/packaging/rpm offline TOPDIR="$topdir" OFFLINE_RPM="${candidates[0]}" \
                OFFLINE_REPOSDIR=/offline-inputs/repos OFFLINE_VARSDIR=/offline-inputs/vars \
                OFFLINE_REPOS="${repos[*]}" OFFLINE_RELEASEVER=8 \
                OFFLINE_OS_KEY_DIR=/offline-inputs/os-keys OFFLINE_HEIMDALL_KEY=/artifacts/RPM-TEST-GPG-KEY
            done
            # Disposable candidate specs only: production application requirements stay unchanged.
            dnf install -y rpm-build
            for release in 1 2; do
              topdir="/fixture-$release"
              mkdir -p "$topdir"/{SPECS,SOURCES}
              cp /artifacts/first/runtime-manifest.json "$topdir/SOURCES/runtime-manifest.json"
              cat > "$topdir/SPECS/fixture.spec" <<SPEC
          Name: heimdall-server
          Version: 0.0.$release
          Release: 0.1.integration.el8
          Summary: Disconnected upgrade dependency fixture
          License: MIT
          Requires: bash
          %description
          Disposable test fixture.
          %install
          mkdir -p %{buildroot}/usr/share/heimdall-offline-fixture
          echo $release > %{buildroot}/usr/share/heimdall-offline-fixture/release
          %files
          /usr/share/heimdall-offline-fixture/release
          SPEC
              if [[ $release == 2 ]]; then sed -i '/Requires: bash/a Requires: tree' "$topdir/SPECS/fixture.spec"; fi
              rpmbuild --define "_topdir $topdir" -bb "$topdir/SPECS/fixture.spec"
            done
            fixtures=(/fixture-{1,2}/RPMS/${{ matrix.arch }}/heimdall-server-*.rpm)
            HEIMDALL_RPM_TEST=1 bash /workspace/packaging/rpm/tests/sign-rpms.sh --container /fixture-key.asc "${fixtures[@]}"
            for release in 1 2; do
              candidates=(/fixture-$release/RPMS/${{ matrix.arch }}/heimdall-server-*.rpm)
              make -C /workspace/packaging/rpm offline TOPDIR="/fixture-$release" OFFLINE_RPM="${candidates[0]}" \
                OFFLINE_REPOSDIR=/offline-inputs/repos OFFLINE_VARSDIR=/offline-inputs/vars \
                OFFLINE_REPOS="${repos[*]}" OFFLINE_RELEASEVER=8 \
                OFFLINE_OS_KEY_DIR=/offline-inputs/os-keys OFFLINE_HEIMDALL_KEY=/fixture-key.asc
            done
          PRODUCER
          mkdir -p artifacts/dependency-first artifacts/dependency-second
          docker cp "$producer:/fixture-1/OFFLINE/." artifacts/dependency-first/
          docker cp "$producer:/fixture-2/OFFLINE/." artifacts/dependency-second/
          mkdir -p artifacts/offline-first artifacts/offline-second
          docker cp "$producer:/offline-first/OFFLINE/." artifacts/offline-first/
          docker cp "$producer:/offline-second/OFFLINE/." artifacts/offline-second/

      - uses: actions/upload-artifact@v7
        with:
          name: offline-ol-el8-${{ matrix.arch }}
          path: |
            artifacts/offline-first/*.tar.gz
            artifacts/offline-first/*.tar.gz.sha256
            artifacts/offline-second/*.tar.gz
            artifacts/offline-second/*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Verify disconnected upgrade introduces a real Oracle dependency
        run: |
          fixture="heimdall-offline-dependency-${{ matrix.arch }}"
          docker pull --platform '${{ matrix.platform }}' oraclelinux:8
          docker run -d --name "$fixture" --network=none --platform '${{ matrix.platform }}' \
            --entrypoint /bin/bash -e HEIMDALL_RPM_TEST=1 oraclelinux:8 -c 'sleep infinity'
          mkdir -p packaging/rpm/dist/offline/evidence/dependency
          cleanup() {
            result=$?
            docker cp "$fixture:/tmp/rpm-offline-evidence/." packaging/rpm/dist/offline/evidence/dependency/ || true
            docker rm -f "$fixture" >/dev/null
            exit "$result"
          }
          trap cleanup EXIT
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$fixture")" = none
          docker inspect "$fixture" > packaging/rpm/dist/offline/evidence/dependency/container.json
          for release in first second; do
            mapfile -d '' -t bundles < <(find "artifacts/dependency-$release" -name '*.tar.gz' -print0)
            test "${#bundles[@]}" -eq 1
            (cd "$(dirname "${bundles[0]}")" && sha256sum --check "$(basename "${bundles[0]}").sha256")
            mkdir "artifacts/dependency-$release/extracted"
            tar -xzf "${bundles[0]}" -C "artifacts/dependency-$release/extracted"
            bundle="artifacts/dependency-$release/extracted/$(basename "${bundles[0]}" .tar.gz)"
            docker cp "$bundle" "$fixture:/tmp/$release"
          done
          docker cp packaging/rpm/tests/. "$fixture:/tmp/rpm-tests"
          timeout 900 docker exec -e HEIMDALL_OFFLINE_DEPENDENCY_UPGRADE_BUNDLE=/tmp/second \
            "$fixture" bash /tmp/rpm-tests/offline-install.sh /tmp/first \
            | tee packaging/rpm/dist/offline/evidence/dependency/output.log

      - name: Verify disconnected two-bundle Oracle Linux lifecycle
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          docker pull --platform '${{ matrix.platform }}' oraclelinux:8
          mapfile -d '' -t first < <(find artifacts/offline-first -name '*.tar.gz' -print0)
          mapfile -d '' -t second < <(find artifacts/offline-second -name '*.tar.gz' -print0)
          test "${#first[@]}" -eq 1 && test "${#second[@]}" -eq 1
          bash packaging/rpm/tests/run-offline.sh '${{ matrix.platform }}' oraclelinux:8 "${first[0]}" "${second[0]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-evidence-ol-el8-${{ matrix.arch }}
          path: packaging/rpm/dist/offline/evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify real package lifecycle
        env:
          RPM_TEST_GPG_KEY: ${{ github.workspace }}/artifacts/RPM-TEST-GPG-KEY
        run: |
          version=$(sed -e 's/[[:space:]]//g' -e 's/^v//' VERSION)
          bash packaging/rpm/tests/run-lifecycle.sh '${{ matrix.platform }}' \
            "artifacts/first/RPMS/${{ matrix.arch }}/heimdall-server-${version}-0.3.integration.el8.${{ matrix.arch }}.rpm" \
            "artifacts/second/RPMS/${{ matrix.arch }}/heimdall-server-${version}-0.4.integration.el8.${{ matrix.arch }}.rpm"

  publish:
    name: Attach RPMs and offline bundles to the release
    needs: [build, smoke-test, offline-test, lifecycle-ol8]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          path: rpms
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: offline-{rocky,ol}-*
          path: offline
          merge-multiple: true

      - name: Reject integration artifacts before publication
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          mapfile -d '' -t artifacts < <(find rpms -name '*.rpm' -print0)
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            release=$(rpm -qp --qf '%{RELEASE}' "$artifact")
            case "$release" in
              *integration*) echo "Refusing to publish integration artifact: $artifact" >&2; exit 1 ;;
            esac
          done
          mapfile -d '' -t archives < <(find offline -name '*.tar.gz' -print0)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
            inspection=$(mktemp -d)
            tar -xzf "$archive" -C "$inspection" --wildcards '*/repo/Packages/heimdall-server-*.rpm'
            mapfile -d '' -t candidates < <(find "$inspection" -name 'heimdall-server-*.rpm' -print0)
            test "${#candidates[@]}" -eq 1
            release=$(rpm -qp --qf '%{RELEASE}' "${candidates[0]}")
            case "$release" in
              *integration*) echo "Refusing to publish integration bundle: $archive" >&2; exit 1 ;;
            esac
            rm -rf "$inspection"
          done

      - name: List artifacts
        run: find rpms -name '*.rpm' -printf '%f\n' | sort

      # Provenance attestations describe the build; they are not RPM signatures.
      # A future stable milestone must replace ephemeral acceptance-test signing
      # and parameterize lifecycle releases before enabling stable publication.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            rpms/**/*.rpm
            offline/**/*.tar.gz
            offline/**/*.tar.gz.sha256

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            rpms/**/*.rpm
            offline/**/*.tar.gz
            offline/**/*.tar.gz.sha256
          fail_on_unmatched_files: true
