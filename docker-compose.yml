services:
  database:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=heimdall-server-production
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - "5432"

  certs:
    image: registry.access.redhat.com/ubi9/ubi:latest
    restart: unless-stopped
    command: sh -c "sh /etc/pki/ca-trust/source/anchors/dodcerts.sh && update-ca-trust && tail -f /dev/null"
    volumes:
      - type: volume
        source: cert_bundles
        target: /etc/pki/ca-trust/extracted/
      - type: bind
        source: ./certs/
        target: /etc/pki/ca-trust/source/anchors/

  server:
    image: mitre/heimdall2:release-latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=database
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    env_file: .env
    ports:
      - "3000"
    volumes:
      - type: volume
        source: cert_bundles
        target: /etc/pki/ca-trust/extracted/
        read_only: true
        volume:
          nocopy: true
    depends_on:
      database:
        condition: service_healthy
    # ADR-006 §17: probe the readiness endpoint only. /admin/migration-status
    # is NEVER probed — its counts are full table scans.
    #
    # RELEASE COUPLING (deliberate, not hidden): this file pulls
    # `release-latest`, and /health/ready ships with the next release. Both
    # land in the same repo state, so release-latest consumers get them
    # together; a git-pull user running a stale cached image will see
    # "unhealthy" until `docker compose pull`. That status stays purely
    # informational — see the nginx depends_on note below.
    #
    # The response body is matched, not just the HTTP status, because the app
    # serves the SPA as a catch-all for unmatched routes: an image WITHOUT
    # /health/ready answers 200 with index.html, which `curl -f` alone would
    # accept as healthy. Matching the readiness envelope is what makes a stale
    # image report unhealthy instead of silently lying.
    #
    # start_period exceeds the database's 80s because the server's first boot
    # additionally runs migrations and seeding before it can serve traffic.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/health/ready | grep -q '\"status\":\"ok\"'"
        ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:alpine
    environment:
      NGINX_HOST: ${NGINX_HOST}
    volumes:
      - ./nginx/conf/:/etc/nginx/templates/
      - ./nginx/certs/:/etc/nginx/cert/
    ports:
      - "80:80"
      - "443:443"
    # Deliberately NOT upgraded to `condition: service_healthy` (blast-radius
    # control): until a release ships with /health/ready, a stale cached image
    # would never report healthy and nginx would wait forever. Revisit only
    # after the endpoints are in a published release.
    depends_on:
      - "server"

volumes:
  cert_bundles:
