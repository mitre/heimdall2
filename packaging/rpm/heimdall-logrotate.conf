# /etc/logrotate.d/heimdall-server
# Heimdall Server log rotation
# Installed by: heimdall-server RPM
#
# Retention: 90 days online (FedRAMP Moderate AU-11)
# Primary log path is journald. This handles rsyslog-forwarded file copies.

/var/log/heimdall-server/heimdall-server.log {
    daily
    maxsize 100M
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 heimdall heimdall
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
    endscript
}

/var/log/heimdall-server/heimdall-cli.log {
    daily
    maxsize 100M
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root heimdall
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
    endscript
}
