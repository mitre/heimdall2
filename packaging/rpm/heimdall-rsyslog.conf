# /etc/rsyslog.d/30-heimdall-server.conf
# Heimdall Server rsyslog configuration
# Installed by: heimdall-server RPM
#
# Primary log path: NestJS -> stdout -> systemd -> journald
# This config routes journald messages to dedicated log files
# via the imjournal bridge.

# Route Heimdall server messages to dedicated log file
if $programname == 'heimdall-server' then {
    action(type="omfile"
           file="/var/log/heimdall-server/heimdall-server.log"
           fileCreateMode="0640"
           fileOwner="heimdall"
           fileGroup="heimdall"
           dirCreateMode="0750"
           dirOwner="heimdall"
           dirGroup="heimdall")
    stop
}

# Route CLI admin actions to separate log
if $programname == 'heimdall-cli' then {
    action(type="omfile"
           file="/var/log/heimdall-server/heimdall-cli.log"
           fileCreateMode="0640"
           fileOwner="root"
           fileGroup="heimdall"
           dirCreateMode="0750")
    stop
}
