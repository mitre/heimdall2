version: 2

project_name: heimdall-cli

# Stage man pages + shell completions so nFPM can package them.
# Tests + go mod tidy keep parity with `make test` / `go mod tidy` workflow.
before:
  hooks:
    - go mod tidy
    - go test ./...
    - make release-prep

builds:
  - id: heimdall-cli
    main: ./cmd/heimdall-cli
    binary: heimdall-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mitre/heimdall2/apps/heimdall-cli/internal/version.Version={{.Version}}
      - -X github.com/mitre/heimdall2/apps/heimdall-cli/internal/version.Commit={{.Commit}}
      - -X github.com/mitre/heimdall2/apps/heimdall-cli/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

nfpms:
  - id: heimdall-cli
    package_name: heimdall-cli
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: MITRE
    homepage: https://github.com/mitre/saf-packaging
    maintainer: SAF Team <saf@groups.mitre.org>
    description: |-
      Admin CLI for Heimdall Server installations on Linux.
      Handles install-time setup (PostgreSQL bootstrap, fapolicyd trust,
      firewalld, SELinux), day-2 admin (status, reconfigure, backup), and
      is invoked from the heimdall-server RPM scriptlets.
    license: Apache-2.0
    formats:
      - rpm
    # FHS: distro-managed binaries belong in /usr/bin (not /usr/local/bin,
    # which is reserved for sysadmin/manual installs).
    bindir: /usr/bin
    # Plain "1" — nFPM does not expand %{?dist}. EL-specific dist tag is
    # added by COPR mock-build (separate ssz card), not here.
    release: "1"
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/heimdall-cli/LICENSE
        type: license
      - src: ./README.md
        dst: /usr/share/doc/heimdall-cli/README.md
        type: doc
      # Man pages — uncompressed; man-db filetrigger compresses on install.
      - src: ./man/man1/heimdall-cli.1
        dst: /usr/share/man/man1/heimdall-cli.1
      - src: ./man/man1/heimdall-cli-add-cert.1
        dst: /usr/share/man/man1/heimdall-cli-add-cert.1
      - src: ./man/man1/heimdall-cli-backup.1
        dst: /usr/share/man/man1/heimdall-cli-backup.1
      - src: ./man/man1/heimdall-cli-config.1
        dst: /usr/share/man/man1/heimdall-cli-config.1
      - src: ./man/man1/heimdall-cli-config-get.1
        dst: /usr/share/man/man1/heimdall-cli-config-get.1
      - src: ./man/man1/heimdall-cli-config-list.1
        dst: /usr/share/man/man1/heimdall-cli-config-list.1
      - src: ./man/man1/heimdall-cli-config-set.1
        dst: /usr/share/man/man1/heimdall-cli-config-set.1
      - src: ./man/man1/heimdall-cli-diag.1
        dst: /usr/share/man/man1/heimdall-cli-diag.1
      - src: ./man/man1/heimdall-cli-logs.1
        dst: /usr/share/man/man1/heimdall-cli-logs.1
      - src: ./man/man1/heimdall-cli-reset-password.1
        dst: /usr/share/man/man1/heimdall-cli-reset-password.1
      - src: ./man/man1/heimdall-cli-restart.1
        dst: /usr/share/man/man1/heimdall-cli-restart.1
      - src: ./man/man1/heimdall-cli-restore.1
        dst: /usr/share/man/man1/heimdall-cli-restore.1
      - src: ./man/man1/heimdall-cli-set-port.1
        dst: /usr/share/man/man1/heimdall-cli-set-port.1
      - src: ./man/man1/heimdall-cli-setup.1
        dst: /usr/share/man/man1/heimdall-cli-setup.1
      - src: ./man/man1/heimdall-cli-start.1
        dst: /usr/share/man/man1/heimdall-cli-start.1
      - src: ./man/man1/heimdall-cli-status.1
        dst: /usr/share/man/man1/heimdall-cli-status.1
      - src: ./man/man1/heimdall-cli-stop.1
        dst: /usr/share/man/man1/heimdall-cli-stop.1
      - src: ./man/man1/heimdall-cli-validate.1
        dst: /usr/share/man/man1/heimdall-cli-validate.1
      # Shell completions — modern Fedora paths (NOT /etc/bash_completion.d).
      - src: ./completions/heimdall-cli.bash
        dst: /usr/share/bash-completion/completions/heimdall-cli
      - src: ./completions/heimdall-cli.zsh
        dst: /usr/share/zsh/site-functions/_heimdall-cli
      - src: ./completions/heimdall-cli.fish
        dst: /usr/share/fish/vendor_completions.d/heimdall-cli.fish

# No scriptlets needed — file triggers in man-db / bash-completion handle
# index updates automatically on RHEL 8+/Fedora.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
